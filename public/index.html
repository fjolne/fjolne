<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oleg Martynov</title>
  <meta name="description" content="Oleg Martynov. Making unverifiable domains verifiable at loglog.ai.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1917'/%3E%3Ctext x='16' y='23' font-family='ui-monospace,Menlo,monospace' font-size='20' font-weight='600' fill='%23fafaf9' text-anchor='middle'%3Ef%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --hover: #f0efed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0e0d;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --line: #292524;
        --hover: #1a1817;
      }
    }

    * { box-sizing: border-box; margin: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main { width: 100%; max-width: 26rem; }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .tagline {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9375rem;
      text-wrap: balance;
    }

    /* loglog.ai mark in a filled box: text color box, background color line, so it inverts with the theme. */
    .tagline svg { width: 1.2em; height: 1.2em; margin-right: 0.3em; vertical-align: -0.25em; }
    .tagline svg .box { fill: var(--fg); }
    .tagline svg .line { fill: none; stroke: var(--bg); }
    .tagline svg .dot { fill: var(--bg); }

    .tagline a {
      color: var(--fg);
      white-space: nowrap;
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      transition: text-decoration-color 120ms ease;
    }

    .tagline a:hover { text-decoration-color: currentColor; }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 40px;
      border-top: 1px solid var(--line);
    }

    li { border-bottom: 1px solid var(--line); }

    li a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 8px;
      margin: 0 -8px;
      color: inherit;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 120ms ease;
    }

    li a:hover { background: var(--hover); }

    a:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
      border-radius: 2px;
    }

    li svg { width: 18px; height: 18px; flex: none; fill: currentColor; }

    .name { font-weight: 500; }

    .handle {
      margin-left: auto;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.875rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .arrow {
      color: var(--muted);
      transition: transform 120ms ease;
    }

    li a:hover .arrow { transform: translate(2px, -2px); color: var(--fg); }

    @media (prefers-reduced-motion: reduce) {
      a, .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <main>

    <p class="tagline">making unverifiable domains verifiable at <a href="https://loglog.ai"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="box" width="24" height="24" rx="5"/><g transform="translate(1.69 1.31) scale(.825)"><path class="line" d="M5.00 19.00 C5.00 16.64 5.07 14.25 5.61 11.95 C5.93 10.57 6.61 9.23 7.75 8.39 C8.90 7.56 10.29 7.12 11.66 6.78 C14.26 6.14 16.93 5.85 19.60 5.60" stroke-width="1.9" stroke-linecap="round"/><circle class="dot" cx="19.6" cy="5.6" r="1.75"/></g></svg>loglog.ai</a></p>

          <span class="name">GitHub</span>
